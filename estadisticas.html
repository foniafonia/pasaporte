<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Pasaporte · cuánta gente entra</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://abacus.jasoncameron.dev">
<style>body{font:17px/1.5 system-ui,sans-serif;max-width:680px;margin:0 auto;padding:22px 16px 60px;background:#fff8ec;color:#2a2118}h1{font-size:26px;margin:0 0 4px}.sub{color:#6b5a48;margin:0 0 18px}.cajas{display:flex;flex-wrap:wrap;margin:0 -5px}.caja{flex:1 1 140px;margin:5px;background:#fff;border:1px solid #ead9b0;border-radius:16px;padding:12px 14px}.caja b{display:block;font-size:34px;line-height:1.1}.caja span{font-size:14px;color:#6b5a48}.caja.g{background:#2a2118;color:#fff}.caja.g span{color:#f3e7cf}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #ead9b0;margin-top:8px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #f3ead3}th:first-child,td:first-child{text-align:left}th{font-size:13px;color:#6b5a48}h2{font-size:19px;margin:26px 0 4px}</style></head><body>
<h1>🏅 Pasaporte de Logros</h1><p class="sub">Cuánta gente entra y por dónde. Se añade <code>?c=wa</code>, <code>?c=li</code>… al enlace y <code>?yo=1</code> para no contar tus visitas.</p>
<div class="cajas"><div class="caja g"><b id="p">…</b><span>personas distintas</span></div><div class="caja"><b id="a">…</b><span>aperturas</span></div><div class="caja"><b id="k">…</b><span>clics a Skool</span></div></div>
<h2>Por canal</h2><table><tr><th>Canal</th><th>Aperturas</th><th>Personas</th><th>Clics Skool</th></tr><tbody id="t"></tbody></table>
<h2>Por día</h2><table><tr><th>Día</th><th>Aperturas</th><th>Personas</th><th>Clics Skool</th></tr><tbody id="d"></tbody></table>
<script>
var B='https://abacus.jasoncameron.dev/get/foniafonia-juegos/';
function g(k){return fetch(B+k).then(function(r){return r.ok?r.json():{value:0}}).then(function(j){return j.value||0}).catch(function(){return 0})}
var CAN={wa:'WhatsApp',tg:'Telegram',li:'LinkedIn',ln:'LinkedIn',fb:'Facebook',ig:'Instagram',sk:'Skool'};
function dia(o){var d=new Date();d.setDate(d.getDate()-o);return d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)}
function fila(n,v){return '<tr><td>'+n+'</td><td>'+v.join('</td><td>')+'</td></tr>'}
Promise.all([g('pasaporte_personas'),g('pasaporte_aperturas'),g('pasaporte_skool_clics')]).then(function(r){p.textContent=r[0];a.textContent=r[1];k.textContent=r[2]});
Object.keys(CAN).forEach(function(c){Promise.all([g('pasaporte_c_'+c+'_aperturas'),g('pasaporte_c_'+c+'_personas'),g('pasaporte_c_'+c+'_skool')]).then(function(v){t.insertAdjacentHTML('beforeend',fila(CAN[c]+' (?c='+c+')',v))})});
for(var i=0;i<7;i++)(function(x){var f=dia(x);Promise.all([g('pasaporte_aperturas_'+f),g('pasaporte_personas_'+f),g('pasaporte_skool_clics_'+f)]).then(function(v){d.insertAdjacentHTML('beforeend',fila(f.slice(6)+'/'+f.slice(4,6),v))})})(i);
</script></body></html>
